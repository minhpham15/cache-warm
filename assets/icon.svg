<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>cache-warm</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2430"/>
      <stop offset="1" stop-color="#11141B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="0.7" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.6" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- countdown track -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#2C3342" stroke-width="18"/>
  <!-- time left: three quarters of the ring, clockwise from 12 o'clock -->
  <path d="M128 48 A80 80 0 1 1 48 128" fill="none" stroke="url(#ring)"
        stroke-width="18" stroke-linecap="round"/>
  <!-- leading dot -->
  <circle cx="48" cy="128" r="9" fill="#FACC15"/>

  <!-- warm flame -->
  <path d="M128 82
           C 142 102, 162 114, 162 140
           C 162 160, 147 174, 128 174
           C 109 174, 94 160, 94 140
           C 94 124, 104 114, 110 104
           C 112 116, 118 122, 124 124
           C 122 108, 122 94, 128 82 Z"
        fill="url(#flame)"/>
  <path d="M128 132
           C 136 142, 144 148, 144 158
           C 144 166, 137 172, 128 172
           C 119 172, 112 166, 112 158
           C 112 150, 120 144, 128 132 Z"
        fill="#FEF3C7" opacity="0.9"/>
</svg>
